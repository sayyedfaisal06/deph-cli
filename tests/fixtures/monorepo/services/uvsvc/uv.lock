version = 1
requires-python = ">=3.9"

[[package]]
name = "anyio"
version = "4.4.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "idna" },
    { name = "sniffio" },
]
sdist = { url = "https://files.pythonhosted.org/packages/anyio-4.4.0.tar.gz", hash = "sha256:aaa", size = 163930 }
wheels = [
    { url = "https://files.pythonhosted.org/packages/anyio-4.4.0-py3-none-any.whl", hash = "sha256:bbb", size = 86780 },
]

[[package]]
name = "httpx"
version = "0.27.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "anyio" },
    { name = "idna" },
]
wheels = [
    { url = "https://files.pythonhosted.org/packages/httpx-0.27.0-py3-none-any.whl", hash = "sha256:ccc", size = 75590 },
]

[[package]]
name = "idna"
version = "3.7"
source = { registry = "https://pypi.org/simple" }
wheels = [
    { url = "https://files.pythonhosted.org/packages/idna-3.7-py3-none-any.whl", hash = "sha256:ddd", size = 66801 },
]

[[package]]
name = "localtool"
version = "0.2.0"
source = { editable = "packages/localtool" }
dependencies = [
    { name = "httpx" },
]

[package.metadata]
requires-dist = [{ name = "httpx", specifier = ">=0.27" }]

[[package]]
name = "sniffio"
version = "1.3.1"
source = { registry = "https://pypi.org/simple" }
wheels = [
    { url = "https://files.pythonhosted.org/packages/sniffio-1.3.1-py3-none-any.whl", hash = "sha256:eee", size = 10235 },
]

[[package]]
name = "uvsvc"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "httpx" },
    { name = "vendored-lib" },
]

[package.metadata]
requires-dist = [
    { name = "httpx", specifier = ">=0.27" },
    { name = "vendored-lib", git = "https://github.com/example/vendored-lib.git" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = ">=8" }]

[[package]]
name = "Vendored-Lib"
version = "1.0.0"
source = { git = "https://github.com/example/vendored-lib.git?rev=main#8f7e6d5c4b3a2918f7e6d5c4b3a2918f7e6d5c4" }
