name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: pipx run ruff check src tests
      - name: imports with no dependencies installed
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --no-deps .
          /tmp/bare/bin/python -c "import deph, deph.cli, deph.parser, deph.policy, deph.enrich, deph.scanners, deph.studio, deph.versions, deph.spdx, deph.report"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  npm-wrapper:
    # The npm package runs the vendored Python with the system interpreter, so
    # what matters is that it starts everywhere and passes exit codes through.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vendor the python source
        working-directory: npm
        run: node scripts/sync-python.js
      - name: wrapper smoke test
        working-directory: npm
        run: node scripts/smoke.js
      - name: install the packed tarball and run it
        shell: bash
        run: |
          cd npm && npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/deph-cli-*.tgz
          deph --version
          rc=0; deph check || rc=$?
          # No .deph file here, so this must be 2 ("couldn't judge"), not 0.
          if [ "$rc" -ne 2 ]; then
            echo "expected exit 2 with no .deph file, got $rc"; exit 1
          fi

  coverage:
    # Branch coverage, not line coverage: the interesting paths in a parser are
    # the ones that reject input, and line coverage hides those.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" coverage
      - name: pytest under coverage
        run: |
          coverage run --branch -m pytest -q
          coverage report --show-missing --fail-under=85   # measured 88%
      - name: coverage xml
        if: always()
        run: coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  dogfood:
    # The installed CLI against the fixture repo, hitting live registries and
    # advisories. The fixtures are vulnerable, so check has to exit 1; if it
    # exits 0 something upstream of the policy engine has stopped working.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install .
      - name: init, scan, check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: tests/fixtures/monorepo
        run: |
          deph init
          deph scan
          deph validate
          cat repo.deph
          rc=0; deph check || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "expected check to exit 1 on the vulnerable fixtures, got $rc"
            exit 1
          fi
      - name: machine-readable output is well formed
        working-directory: tests/fixtures/monorepo
        run: |
          deph check --format json > check.json || true
          python -c "
          import json; d = json.load(open('check.json'))
          assert d['schema'] == 2 and not d['ok'], d
          assert d['summary']['fail'] >= 1, d
          assert d['coverage']['audited'] > 0, d
          "
          deph check --format sarif > check.sarif || true
          python -c "
          import json; d = json.load(open('check.sarif'))
          assert d['version'] == '2.1.0', d
          assert d['runs'][0]['tool']['driver']['name'] == 'deph'
          assert d['runs'][0]['results'], 'expected findings in SARIF'
          "
          deph sbom -o sbom.json
          python -c "
          import json; d = json.load(open('sbom.json'))
          assert d['bomFormat'] == 'CycloneDX', d
          assert d['components'], 'expected components in the SBOM'
          assert all(c['purl'].startswith('pkg:') for c in d['components'])
          "
      - name: rescan produces no diff but the timestamp
        working-directory: tests/fixtures/monorepo
        run: |
          # .bak, not .deph: a second .deph file makes discovery refuse to pick
          cp repo.deph before.bak
          deph scan --offline
          diff <(grep -v '^// ---- generated' before.bak) \
               <(grep -v '^// ---- generated' repo.deph)
      - name: render dashboard
        working-directory: tests/fixtures/monorepo
        run: deph render -o deph-report.html
      - uses: actions/upload-artifact@v4
        with:
          name: deph-report
          path: |
            tests/fixtures/monorepo/deph-report.html
            tests/fixtures/monorepo/sbom.json
            tests/fixtures/monorepo/check.sarif

  corpus:
    # Scan real repositories. Hand-written fixtures only ever contain shapes I
    # thought of; this is what catches the rest. It clones from GitHub, so it
    # runs on a schedule and on demand rather than on every PR.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: scan the corpus
        run: python tests/corpus/run_corpus.py --workdir "${RUNNER_TEMP}/corpus"
      - name: corpus report
        if: always()
        run: |
          python tests/corpus/run_corpus.py \
            --workdir "${RUNNER_TEMP}/corpus" --json > corpus.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: corpus.json
